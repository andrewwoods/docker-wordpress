services:

  wordpress:
    restart: always
    ports:
      - 8080:80
    environment: &wp-env
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: example-123
      WORDPRESS_DB_NAME: wp_standard 
      WORDPRESS_DEBUG: true 
      WORDPRESS_DEBUG_LOG: true 
    volumes: &wp-volumes
      - wordpress:/var/www/html
      - ./plugins:/var/www/html/wp-content/plugins
      - ./themes:/var/www/html/wp-content/themes
    build:
      dockerfile: ./WordPress.Dockerfile

  db:
    image: mysql:8.0
    restart: always
    ports:
      - 3306:3306
    command: --default-authentication-plugin=mysql_native_password
  
    environment:
      MYSQL_DATABASE: wp_standard
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: example-123
      MYSQL_ROOT_PASSWORD: rootpass 
    volumes:
      - db:/var/lib/mysql

  wpcli:
    build:
      dockerfile: ./WPcli.Dockerfile
    environment: *wp-env
    volumes: *wp-volumes
    network_mode: service:wordpress
    entrypoint: ["wp"]
    command: ["user", "list"]

volumes:
  wordpress:
  db:
  plugins:
  themes:
